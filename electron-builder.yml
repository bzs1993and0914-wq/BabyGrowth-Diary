appId: com.babygrow.app
productName: BabyGrow
# 使用国内镜像加速 Electron 运行时下载（比直连 GitHub 通常更稳定、更快）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: backend/dist/babygrow-server
    to: babygrow-server
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
