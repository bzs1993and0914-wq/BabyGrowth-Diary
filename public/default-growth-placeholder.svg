<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffecd2"/>
      <stop offset="50%" stop-color="#fcb69f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd1e8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcba4"/>
      <stop offset="100%" stop-color="#f7a072"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c8"/>
      <stop offset="100%" stop-color="#ffcba4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f0a0a0" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="0"/>

  <!-- Decorative bubbles background -->
  <circle cx="60" cy="80" r="35" fill="#fff" opacity="0.4"/>
  <circle cx="740" cy="100" r="25" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="380" r="20" fill="#fff" opacity="0.3"/>
  <circle cx="700" cy="380" r="30" fill="#fff" opacity="0.35"/>
  <circle cx="400" cy="30" r="15" fill="#fff" opacity="0.3"/>

  <!-- Small stars -->
  <g fill="#ffb347" opacity="0.7">
    <polygon points="80,50 83,60 93,60 85,66 88,76 80,70 72,76 75,66 67,60 77,60" transform="scale(0.7) translate(50,30)"/>
    <polygon points="80,50 83,60 93,60 85,66 88,76 80,70 72,76 75,66 67,60 77,60" transform="scale(0.5) translate(1200,80)"/>
    <polygon points="80,50 83,60 93,60 85,66 88,76 80,70 72,76 75,66 67,60 77,60" transform="scale(0.6) translate(100,580)"/>
    <polygon points="80,50 83,60 93,60 85,66 88,76 80,70 72,76 75,66 67,60 77,60" transform="scale(0.5) translate(1100,550)"/>
  </g>

  <!-- Heart decorations -->
  <g opacity="0.5">
    <path d="M 130 140 C 130 133, 140 127, 147 133 C 154 127, 164 133, 164 140 C 164 150, 147 162, 147 162 C 147 162, 130 150, 130 140 Z" fill="#ff9eb5"/>
    <path d="M 640 320 C 640 313, 650 307, 657 313 C 664 307, 674 313, 674 320 C 674 330, 657 342, 657 342 C 657 342, 640 330, 640 320 Z" fill="#ff9eb5"/>
    <path d="M 680 130 C 680 124, 688 119, 694 124 C 700 119, 708 124, 708 130 C 708 138, 694 148, 694 148 C 694 148, 680 138, 680 130 Z" fill="#ffb3c6"/>
  </g>

  <!-- Baby body / onesie -->
  <g filter="url(#softShadow)">
    <!-- Body -->
    <ellipse cx="400" cy="330" rx="85" ry="95" fill="url(#bodyGrad)"/>
    <!-- Onesie collar -->
    <path d="M 340 275 Q 370 268 400 272 Q 430 268 460 275 L 455 295 Q 430 285 400 288 Q 370 285 345 295 Z" fill="#fff" opacity="0.85"/>
    <!-- Onesie button -->
    <circle cx="400" cy="370" r="4" fill="#f08080" opacity="0.8"/>
    <circle cx="400" cy="390" r="4" fill="#f08080" opacity="0.8"/>

    <!-- Left arm -->
    <ellipse cx="308" cy="320" rx="22" ry="42" fill="url(#bodyGrad)" transform="rotate(-15, 308, 320)"/>
    <!-- Right arm -->
    <ellipse cx="492" cy="320" rx="22" ry="42" fill="url(#bodyGrad)" transform="rotate(15, 492, 320)"/>

    <!-- Left hand (chubby) -->
    <circle cx="294" cy="358" r="18" fill="#ffe0c8"/>
    <circle cx="282" cy="350" r="7" fill="#ffe0c8"/>
    <circle cx="278" cy="360" r="7" fill="#ffe0c8"/>
    <circle cx="283" cy="370" r="7" fill="#ffe0c8"/>
    <circle cx="293" cy="374" r="7" fill="#ffe0c8"/>
    <!-- Right hand (chubby) -->
    <circle cx="506" cy="358" r="18" fill="#ffe0c8"/>
    <circle cx="518" cy="350" r="7" fill="#ffe0c8"/>
    <circle cx="522" cy="360" r="7" fill="#ffe0c8"/>
    <circle cx="517" cy="370" r="7" fill="#ffe0c8"/>
    <circle cx="507" cy="374" r="7" fill="#ffe0c8"/>

    <!-- Left leg -->
    <ellipse cx="368" cy="415" rx="24" ry="35" fill="url(#bodyGrad)"/>
    <!-- Right leg -->
    <ellipse cx="432" cy="415" rx="24" ry="35" fill="url(#bodyGrad)"/>

    <!-- Left foot (chubby) -->
    <ellipse cx="360" cy="447" rx="22" ry="14" fill="#ffe0c8"/>
    <!-- Right foot (chubby) -->
    <ellipse cx="440" cy="447" rx="22" ry="14" fill="#ffe0c8"/>
  </g>

  <!-- Baby head -->
  <g filter="url(#softShadow)">
    <circle cx="400" cy="220" r="78" fill="url(#faceGrad)"/>
  </g>

  <!-- Hair -->
  <g fill="#c8845a" opacity="0.85">
    <ellipse cx="400" cy="148" rx="50" ry="18" fill="#c8845a"/>
    <path d="M 352 162 Q 340 145 345 130 Q 360 118 378 128 Q 370 142 372 158 Z" fill="#c8845a"/>
    <path d="M 448 162 Q 460 145 455 130 Q 440 118 422 128 Q 430 142 428 158 Z" fill="#c8845a"/>
    <!-- Cute hair tuft -->
    <ellipse cx="400" cy="144" rx="12" ry="18" transform="rotate(-5, 400, 144)" fill="#c8845a"/>
  </g>

  <!-- Ears -->
  <circle cx="323" cy="220" r="18" fill="#ffcba4"/>
  <circle cx="323" cy="220" r="11" fill="#f7a072" opacity="0.5"/>
  <circle cx="477" cy="220" r="18" fill="#ffcba4"/>
  <circle cx="477" cy="220" r="11" fill="#f7a072" opacity="0.5"/>

  <!-- Eyes -->
  <g>
    <!-- Left eye white -->
    <ellipse cx="374" cy="215" rx="16" ry="17" fill="#fff"/>
    <!-- Right eye white -->
    <ellipse cx="426" cy="215" rx="16" ry="17" fill="#fff"/>
    <!-- Left pupil -->
    <circle cx="376" cy="216" r="9" fill="#5c3d2e"/>
    <!-- Right pupil -->
    <circle cx="428" cy="216" r="9" fill="#5c3d2e"/>
    <!-- Eye shine left -->
    <circle cx="380" cy="211" r="3.5" fill="#fff"/>
    <!-- Eye shine right -->
    <circle cx="432" cy="211" r="3.5" fill="#fff"/>
    <!-- Eyelashes left -->
    <line x1="362" y1="202" x2="358" y2="196" stroke="#5c3d2e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="370" y1="199" x2="368" y2="192" stroke="#5c3d2e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="378" y1="199" x2="378" y2="192" stroke="#5c3d2e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyelashes right -->
    <line x1="422" y1="199" x2="422" y2="192" stroke="#5c3d2e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="430" y1="199" x2="432" y2="192" stroke="#5c3d2e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="438" y1="202" x2="442" y2="196" stroke="#5c3d2e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 360 198 Q 374 192 388 196" stroke="#c8845a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 412 196 Q 426 192 440 198" stroke="#c8845a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="400" cy="233" rx="7" ry="5" fill="#f09070" opacity="0.5"/>
  <circle cx="396" cy="233" r="3" fill="#f09070" opacity="0.6"/>
  <circle cx="404" cy="233" r="3" fill="#f09070" opacity="0.6"/>

  <!-- Smile / mouth -->
  <path d="M 382 248 Q 400 264 418 248" stroke="#e07070" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tongue peek -->
  <ellipse cx="400" cy="257" rx="9" ry="5" fill="#ff8fa3" opacity="0.7"/>

  <!-- Rosy cheeks -->
  <circle cx="350" cy="240" r="20" fill="#ffaaaa" opacity="0.35"/>
  <circle cx="450" cy="240" r="20" fill="#ffaaaa" opacity="0.35"/>

  <!-- Baby hat (beanie) -->
  <ellipse cx="400" cy="156" rx="64" ry="22" fill="#ff9eb5"/>
  <rect x="336" y="148" width="128" height="20" fill="#ff9eb5" rx="8"/>
  <ellipse cx="400" cy="148" rx="64" ry="30" fill="#ff9eb5"/>
  <ellipse cx="400" cy="122" rx="48" ry="42" fill="#ffb3c6"/>
  <!-- Hat stripe -->
  <ellipse cx="400" cy="118" rx="30" ry="8" fill="#fff" opacity="0.5"/>
  <!-- Pom-pom on hat -->
  <circle cx="400" cy="84" r="16" fill="#fff" opacity="0.9"/>
  <circle cx="395" cy="80" r="5" fill="#ffcce0" opacity="0.7"/>
  <circle cx="406" cy="82" r="4" fill="#ffcce0" opacity="0.7"/>
  <circle cx="400" cy="90" r="4" fill="#ffcce0" opacity="0.7"/>

  <!-- Floating stars around baby -->
  <g filter="url(#glow)" opacity="0.8">
    <text x="180" y="200" font-size="28" text-anchor="middle" fill="#ffcc44">&#9733;</text>
    <text x="620" y="190" font-size="22" text-anchor="middle" fill="#ffcc44">&#9733;</text>
    <text x="155" y="310" font-size="18" text-anchor="middle" fill="#ff9eb5">&#10022;</text>
    <text x="645" y="300" font-size="20" text-anchor="middle" fill="#ff9eb5">&#10022;</text>
  </g>

  <!-- Bottom text: Chinese label -->
  <text x="400" y="466" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#c0706a" letter-spacing="4" opacity="0.85">&#23453;&#23453;&#25104;&#38271;&#35760;&#24405;</text>
</svg>
